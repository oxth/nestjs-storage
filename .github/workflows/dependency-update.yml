name: Scheduled dependency update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # No --frozen-lockfile: this step is expected to change the lockfile.
      - run: pnpm install --no-frozen-lockfile

      # Bumps dependencies/devDependencies in package.json and the lockfile.
      # peerDependencies (the optional aws-sdk/@google-cloud/@azure driver
      # SDKs) are intentionally left alone - those are compatibility ranges
      # for consumers, not versions we pin, and `pnpm update` doesn't touch
      # peerDependencies anyway.
      - run: pnpm update --latest

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: scheduled dependency update'
          branch: chore/scheduled-dependency-update
          title: 'chore: scheduled dependency update'
          body: |
            Automated dependency update, opened by the
            [scheduled dependency update workflow](../actions/workflows/dependency-update.yml).

            `pnpm update --latest` was run against `dependencies` and
            `devDependencies`. This PR does not merge itself - the CI
            workflow will run against it like any other pull request, and it
            needs a human review/approval before merging.
          labels: dependencies

      - name: Summary
        if: steps.pr.outputs.pull-request-number
        run: |
          echo "Opened/updated PR #${{ steps.pr.outputs.pull-request-number }}: ${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
