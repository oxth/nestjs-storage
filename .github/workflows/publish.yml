name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write # required for npm's OIDC Trusted Publisher auth + provenance
  contents: write # required to commit the version bump back to main after publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test:cov

      - run: pnpm build

      # --ignore-scripts is required here: package.json's own preversion/
      # postversion hooks (for the local `pnpm version <bump>` release flow)
      # would otherwise re-run inside this job too - postversion's `git push
      # --follow-tags` fails outright on this detached-HEAD tag checkout,
      # and preversion would needlessly redo the lint/test that already ran
      # above.
      - name: Set package.json version from the pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm version --ignore-scripts --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # npm's OIDC "Trusted Publisher" flow (configured on npmjs.com for this
      # package, pointing at this repo + workflow) needs a recent npm CLI and
      # `npm publish` itself - it's not implemented by `pnpm publish`. No
      # NPM_TOKEN secret is used or needed; auth happens via the id-token
      # permission above.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance

      # The version bump above only exists in this job's detached-HEAD
      # checkout of the tag - it was never committed anywhere. Reapply it on
      # top of main's current tip and push, so the repository's package.json
      # reflects what was actually published instead of staying stale.
      - name: Commit version bump back to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          pnpm version --ignore-scripts --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          if git diff --quiet -- package.json; then
            echo "main's package.json is already at ${GITHUB_REF_NAME#v}; nothing to commit."
          else
            git commit -m "chore: release ${GITHUB_REF_NAME}" -- package.json
            git push origin main
          fi
