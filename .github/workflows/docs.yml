name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    # No `tags:` trigger: GitHub Pages' auto-created environment only
    # allows branch deployments by default, so a tag-triggered run fails
    # with "not allowed to deploy... due to environment protection rules".
    # Every release already lands a commit on main too (via the
    # `pnpm version` postversion hook or publish.yml's bump-back step), so
    # the branch trigger alone still redeploys docs on every release.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
